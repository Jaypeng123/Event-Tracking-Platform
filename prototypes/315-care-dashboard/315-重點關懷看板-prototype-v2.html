<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>重點關懷管理看板 v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout v2: two tabs. 「關懷名單」= triage strip + priority-grouped household list + sticky detail panel. 「統計分析」= its own time filter + KPI row + charts. Light-only product UI. */
:root{
  color-scheme: light;
  --bar:#323434; --canvas:#EEEFEF; --card:#FFFFFF; --sub:#F6F7F7; --line:#E2E4E4;
  --ink:#1F2323; --ink2:#4A5050; --muted:#8B9292;
  --accent:#00868B; --accent-weak:#E3F3F3; --accent-ink:#006A6E;
  --abn:#D9480F; --abn-bg:#FFF1E8; --abn-line:#F6B996;
  --stale:#B07800; --stale-bg:#FFF6DC;
  --ok:#2B8A3E; --ok-bg:#EAF6EC;
  --none:#A3AAAA;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--canvas)}
body{font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff}
.topbar-in{display:flex;align-items:center;flex-wrap:wrap;gap:6px 20px;min-height:56px;padding-block:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar h1{font-size:18px;font-weight:500;margin:0;white-space:nowrap}
.navtabs{display:flex;gap:4px;flex:1;min-width:0}
.navtabs button{border:0;background:transparent;color:#ffffffb3;padding:16px 12px 14px;border-bottom:3px solid transparent;font-size:15px}
.navtabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--accent);font-weight:500}
.navtabs button:hover{color:#fff}
.btn-add{background:var(--accent);border:0;color:#fff;border-radius:6px;padding:7px 16px;font-size:14px;font-weight:500;white-space:nowrap}
.btn-add:hover{background:var(--accent-ink)}
.clock{font-size:13px;color:#ffffffb3;white-space:nowrap}
@media (max-width:760px){.clock{display:none}.navtabs{order:3;flex-basis:100%}.navtabs button{padding:8px 10px}}

main{padding-block:20px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1680px;margin:0 auto}

/* triage strip */
.triage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:820px){.triage{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tri{background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:12px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative}
.tri:hover{border-color:var(--line)}
.tri[aria-pressed="true"]{border-color:currentColor}
.tri .lb{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tri .lb i{width:8px;height:8px;border-radius:50%;background:var(--none)}
.tri.abn .lb i{background:var(--abn)} .tri.stale .lb i{background:var(--stale)} .tri.ok .lb i{background:var(--ok)}
.tri .v{font-size:28px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
.tri .v small{font-size:13px;font-weight:400;color:var(--ink2);margin-left:4px}
.tri .sub{font-size:12px;color:var(--muted)}
.tri.abn{color:var(--abn)} .tri.abn .v{color:var(--abn)}
.tri.stale{color:var(--stale)}
.tri.ok{color:var(--ok)}
.tri.none{color:var(--none)}
.tri .new{position:absolute;top:10px;right:12px;font-size:10px;color:var(--stale);border:1px solid currentColor;border-radius:8px;padding:0 6px}

/* list + panel */
.split{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;align-items:start}
@media (max-width:1180px){.split{grid-template-columns:minmax(0,1fr)}}
.listcard{background:var(--card);border-radius:var(--r);padding:8px 0 12px;min-width:0}
.list-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px 12px;border-bottom:1px solid var(--line)}
.list-tools h2{font-size:15px;margin:0;flex:1;min-width:120px}
.kw{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;width:180px;background:var(--card)}
.clear-filter{border:0;background:var(--sub);border-radius:12px;font-size:12px;padding:2px 10px;color:var(--ink2)}
.grp-hd{display:flex;align-items:center;gap:8px;padding:14px 16px 6px;font-size:13px;font-weight:500;color:var(--ink2)}
.grp-hd i{width:8px;height:8px;border-radius:50%}
.grp-hd .c{color:var(--muted);font-weight:400}
.hh{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px 12px 0;border-top:1px solid var(--line);align-items:start}
.hh:hover{background:var(--sub)}
.hh[aria-current="true"]{background:var(--accent-weak)}
.hh.flash{animation:flash 2.2s ease-out}
@keyframes flash{0%,40%{background:#CDEDEE}100%{background:transparent}}
.hh .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.hh .body{min-width:0;display:flex;flex-direction:column;gap:5px}
.hh .l1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.hh .nm{font-size:15px;font-weight:500}
.hh .kind{font-size:12px;color:var(--muted)}
.hh .mem{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2)}
.hh .mem span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.abn{background:var(--abn)} .dot.stale{background:var(--stale)} .dot.ok{background:var(--ok)} .dot.none{background:transparent;border:1.5px solid var(--none)}
.hh .abnline{font-size:13px;color:var(--abn)}
.hh .abnline b{font-weight:500}
.hh .when{text-align:right;font-size:13px;color:var(--ink2);white-space:nowrap}
.hh .when small{display:block;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:0 8px;line-height:20px;border-radius:10px;white-space:nowrap}
.pill.abn{background:var(--abn-bg);color:var(--abn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.none{background:#EEF0F0;color:var(--muted)}
.pill.stale{background:var(--stale-bg);color:var(--stale)}
.empty-row{padding:40px 16px;text-align:center;color:var(--muted)}

.panel{background:var(--card);border-radius:var(--r);position:sticky;top:calc(72px + env(safe-area-inset-top,0px));max-height:calc(100vh - 92px);overflow:auto;display:flex;flex-direction:column}
.panel-hd{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.panel-hd .bc{font-size:12px;color:var(--muted)}
.panel-hd h2{font-size:20px;margin:2px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel-hd .meta{font-size:13px;color:var(--ink2)}
.panel-bd{padding:8px 20px 12px;display:flex;flex-direction:column;gap:12px}
.panel-ft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:0;background:var(--card)}
.mcard{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.mcard.abn{border-color:var(--abn-line)}
.mcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcard .top b{font-size:15px;font-weight:500}
.mcard .top .rel{font-size:12px;color:var(--ink2);background:var(--sub);border-radius:4px;padding:0 6px}
.mcard .top .sp{flex:1}
.mcard .info{font-size:12px;color:var(--muted);margin-top:2px}
.vals{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.vals li{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:baseline;font-size:13px}
.vals li .k{color:var(--ink2)}
.vals li .val{font-weight:500;font-variant-numeric:tabular-nums}
.vals li.abn .val{color:var(--abn)}
.vals li .t{font-size:11px;color:var(--muted);white-space:nowrap}
.okchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;line-height:20px;padding:0 6px;border-radius:3px;background:#E9ECEC;color:var(--ink2);white-space:nowrap}
.chip.src{background:transparent;border:1px solid var(--line)}
.mact{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid #9AA2A2;background:var(--card);border-radius:6px;padding:7px 20px;font-size:14px}
.btn:hover{background:var(--sub)}
.btn.sm{padding:2px 12px;font-size:12px;border-radius:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.primary:disabled{background:#86C3C5;border-color:#86C3C5;cursor:default}
.btn.danger{background:var(--abn);border-color:var(--abn);color:#fff}
.btn.abnbtn{border-color:var(--abn);color:var(--abn)}
.link-danger{border:0;background:none;color:var(--abn);font-size:13px;padding:4px 0}
.link-danger:hover{text-decoration:underline}
.panel-empty{padding:60px 20px;text-align:center;color:var(--muted)}
.panel-close{display:none}
@media (max-width:1180px){
  .panel-wrap{position:fixed;inset:0;z-index:45;background:#00000066;display:flex;justify-content:flex-end}
  .panel-wrap.closed{display:none}
  .panel{position:static;max-height:none;height:100%;width:min(480px,100%);border-radius:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .panel-close{display:inline-grid}
}

/* stats tab */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:13px;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--bar);color:#fff}
.daterange{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 10px}
.daterange input{border:0;background:transparent;font-size:13px;padding:3px 0;min-width:0}
.daterange span,.scope{color:var(--muted);font-size:13px}
.kpirow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.kpirow{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:var(--r);padding:14px 18px}
.kpi .lb{font-size:13px;color:var(--ink2)}
.kpi .v{font-size:28px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:400;color:var(--ink2);margin-left:3px}
.kpi .sub{font-size:12px;color:var(--muted)}
.kpi.abn .v{color:var(--abn)} .kpi.rate .v{color:var(--accent-ink)}
.bar-track{height:6px;background:var(--sub);border-radius:3px;margin-top:8px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border-radius:var(--r);padding:16px 20px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:700}
.card-hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
.card-hd .sp{flex:1}
.section-title{font-size:16px;font-weight:700;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
.section-title small{font-size:12px;font-weight:400;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:7px}
.rank-row{display:grid;grid-template-columns:22px 72px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.rank-row .no{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.rank-row button{border:0;background:none;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row button:hover{color:var(--accent-ink);text-decoration:underline}
.rank-bar{height:22px;background:var(--bar);border-radius:2px;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;min-width:56px;font-variant-numeric:tabular-nums;transition:width .3s}
.rank-row:first-child .rank-bar{background:var(--accent)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart .vlab{fill:var(--ink2);font-size:11px}
.tip{position:absolute;top:0;pointer-events:none;background:var(--bar);color:#fff;border-radius:5px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translateX(-50%);z-index:3;box-shadow:0 4px 12px #0003}
.tip b{font-weight:500}
.tip .row{display:flex;gap:8px;align-items:center}
.tip .dot{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.radio{display:inline-flex;gap:12px;font-size:13px}
.radio label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.radio input{accent-color:var(--bar);margin:0}
.nodata{padding:48px 0;text-align:center;color:var(--muted);font-size:13px}

/* empty */
.empty{max-width:560px;margin:10vh auto 0;background:var(--card);border-radius:12px;padding:36px 32px;text-align:center}
.empty h2{margin:0 0 8px;font-size:20px}
.empty p{color:var(--ink2);margin:0 0 20px}
.empty ol{text-align:left;color:var(--ink2);font-size:13px;margin:0 auto 24px;max-width:380px;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* dialogs */
.overlay{position:fixed;inset:0;background:#00000073;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--card);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:0 12px 40px #0004}
.dialog.small{width:min(440px,100%)}
.dlg-hd{display:flex;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
.dlg-hd h2{margin:0;font-size:19px;font-weight:500;flex:1}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:5px;font-size:22px;line-height:1;place-items:center}
.icon-btn:hover{background:var(--sub)}
.dlg-bd{padding:22px 24px;overflow:auto;min-height:140px}
.dlg-ft{display:flex;justify-content:flex-end;gap:12px;padding:14px 24px;border-top:1px solid var(--line)}
.searchbox{display:flex;align-items:center;border:1px solid var(--accent);border-radius:6px;padding:0 6px 0 12px}
.searchbox.err{border-color:var(--abn)}
.searchbox input{flex:1;border:0;padding:10px 0;font-size:15px;min-width:0;background:transparent}
.searchbox input:focus{outline:none}
.searchbox:focus-within{box-shadow:0 0 0 3px var(--accent-weak)}
.clear{border:1.5px solid #888;background:none;width:18px;height:18px;border-radius:50%;font-size:11px;line-height:1;color:#666;display:grid;place-items:center;margin-right:8px;padding:0}
.link-btn{border:0;background:none;color:var(--accent-ink);font-weight:700;padding:6px}
.field-err{color:var(--abn);font-size:13px;margin:8px 2px 0}
.result{margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.result .rh{padding:12px 14px;background:var(--sub)}
.result .nm{font-weight:500;font-size:15px}
.result .nm span{color:var(--ink2);font-weight:400;margin-left:8px;font-size:13px}
.result .note{font-size:13px;color:var(--ink2);margin-top:4px}
.result.exists{border-color:var(--abn-line)}
.result.exists .rh{background:var(--abn-bg)}
.result.exists .note{color:var(--abn)}
.fam-list{margin:0;padding:6px 14px 10px;list-style:none;display:flex;flex-direction:column}
.fam-list li{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.fam-list li:last-child{border-bottom:0}
.fam-list li .r{width:40px;color:var(--muted)}
.fam-list li .x{margin-left:auto;font-size:12px;color:var(--muted)}
.fam-list li .x.hi{color:var(--accent-ink)}
.testdata{margin-top:18px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.testdata button{border:1px dashed #C4CACA;background:none;border-radius:4px;padding:1px 8px;font-size:12px;color:var(--ink2)}
.testdata button:hover{border-color:var(--accent);color:var(--accent-ink)}

.drawer-ov{justify-content:flex-end;padding:0}
.drawer{background:var(--card);width:min(600px,100%);height:100%;overflow:auto;padding:20px 24px calc(24px + env(safe-area-inset-bottom,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.doc h2{font-size:19px;margin:0;font-weight:700}
.doc h3{font-size:15px;margin:22px 0 8px}
.doc ol,.doc ul{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.doc b{color:var(--ink);font-weight:500}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc th,.doc td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.doc th{color:var(--muted);font-weight:400;white-space:nowrap}

.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--card);border-radius:8px;box-shadow:0 8px 28px #0003;padding:14px 22px;display:flex;align-items:center;gap:8px;font-size:14px;max-width:calc(100% - 32px)}
.toast .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.toast.ok .ic{background:var(--accent)}
.toast.warn .ic{background:#E8A400}

.dock{position:fixed;left:max(16px,calc(env(safe-area-inset-left,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#1F2323EE;color:#fff;border-radius:10px;padding:6px 8px;font-size:12px;max-width:calc(100% - 32px)}
.dock span{opacity:.7;padding:0 4px}
.dock button{border:1px solid #ffffff40;background:transparent;color:#fff;border-radius:6px;padding:3px 10px;font-size:12px}
.dock button:hover{background:#ffffff1a}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="topbar"><div class="topbar-in">
  <h1>重點關懷管理看板</h1>
  <nav class="navtabs" role="tablist" aria-label="頁面">
    <button role="tab" id="tab-list" aria-selected="true" data-tab="list">關懷名單</button>
    <button role="tab" id="tab-stats" aria-selected="false" data-tab="stats">統計分析</button>
  </nav>
  <span class="clock num" id="clock"></span>
  <button class="btn-add" data-act="add">＋ 加入關懷對象</button>
</div></header>

<main id="app"></main>

<div class="overlay" id="addModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="dlg-hd"><h2 id="addTitle">加入關懷對象</h2><button class="icon-btn" data-close aria-label="關閉">×</button></div>
    <div class="dlg-bd">
      <form id="searchForm" class="searchbox" autocomplete="off">
        <input id="q" aria-label="手機號碼或身分證/居留證號" placeholder="輸入手機號碼或身分證/居留證號">
        <button type="button" class="clear" id="qClear" aria-label="清除" hidden>×</button>
        <button type="submit" class="link-btn">搜尋</button>
      </form>

</div>

<script>
(() => {
'use strict';
const DAY = 864e5, HOUR = 36e5;
const NOW = Date.now();
const HOME_ITEMS = ['血壓','心電','血氧','體溫','血糖','尿酸','總膽固醇'];
const WATCH_ITEMS = ['血壓','心電','血氧','心率','心率變異性','睡眠'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const sod = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const fmtDT = ts => { const d = new Date(ts); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = ts => { const d = new Date(ts); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const isoD = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const n0 = v => v.toLocaleString('zh-TW');

/* ---------- mock 個案資料（示意） ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(315);
const P = (id,name,g,age,h,w,phone,nid,fam,rel,src,rate,abn,stale) => ({id,name,g,age,h,w,phone,nid,fam,rel,src,rate,abn,stale:stale||0});
const PEOPLE = [
  P('p01','王橙宇','男',64,172,80,'0912345678','A123456789','F1','本人',['Home','Watch'],1.6,.12),
  P('p02','王大明','男',88,165,62,'0922111333','A100234567','F1','父親',['Home'],1.2,.2),
  P('p03','林秀英','女',85,152,50,'0922111444','A200345678','F1','母親',['Pro','Home'],.9,.15),
  P('p04','王小麗','女',23,160,48,'0933222555','A223456780','F1','子女',[],0,0),
  P('p05','陳美玲','女',52,158,55,'0918777666','B212345678','F2','本人',['Watch'],2.2,.05),
  P('p06','陳志強','男',55,175,78,'0918777555','B112345678','F2','配偶',['Home','Watch'],1.4,.09),
  P('p07','陳宥安','男',19,178,66,'0918777444','B198765432','F2','子女',['Watch'],.6,.02),
  P('p08','黃國華','男',58,170,74,'0955666777','F121212121','F3','本人',['Pro'],1,.1),
  P('p09','黃陳阿嬌','女',82,150,46,'0955666888','F221212121','F3','母親',['Home'],1.3,.22),
  P('p10','林佳蓉','女',45,163,57,'0966111222','E223344556','F4','本人',['Home','Watch'],1.1,.06),
  P('p11','林正雄','男',78,168,70,'0966111333','E123344556','F4','父親',['Pro','Home'],1.5,.18),
  P('p12','張月娥','女',74,155,58,'0966111444','E287654321','F4','母親',['Home'],1,.14,4),
  P('p13','吳俊傑','男',47,180,85,'0966111555','E187654321','F4','配偶',['Watch'],1.8,.07),
  P('p14','吳以晴','女',12,148,38,'0966111666','E276543210','F4','子女',[],0,0),
  P('p15','李建宏','男',67,169,73,'0921000111','A131313131','','本人',['Home'],1.7,.16),
  P('p16','張淑芬','女',71,156,60,'0921000222','A232323232','','本人',['Pro'],.8,.2,6),
  P('p17','劉家豪','男',39,176,72,'0921000333','A143434343','','本人',['Watch'],2.5,.04),
  P('p18','蔡宜庭','女',33,162,52,'0921000444','A254545454','','本人',['Home','Watch'],.7,.05),
  P('p19','許文彬','男',59,171,81,'0921000555','A165656565','','本人',['Pro','Home'],1.2,.13),
  P('p20','鄭雅雯','女',46,160,55,'0921000666','A276767676','','本人',[],0,0),
  P('p21','謝明哲','男',81,166,64,'0921000777','A187878787','','本人',['Home'],1.9,.25),
  P('p22','郭麗華','女',62,157,61,'0921000888','A298989898','','本人',['Home','Watch'],1,.11,40),
  P('p23','洪志偉','男',50,174,79,'0988123456','H120000001','','本人',['Watch'],1.4,.06),
  P('p24','曾怡君','女',28,165,53,'0977555888','H220000002','','本人',['Home'],.5,.03),
  P('p25','周柏翰','男',73,167,69,'0933444555','H130000003','','本人',['Pro'],1.1,.19),
];
const PBY = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const FAM = {};
PEOPLE.forEach(p => { if (p.fam) (FAM[p.fam] = FAM[p.fam] || []).push(p.id); });

/* 量測事件：一筆 = 一次量測，可含多個項目；異常事件 = 任一項目異常 */
const EVENTS = [];
function pick(arr, k){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); }
const today0 = sod(NOW);
PEOPLE.forEach(p => {
  if (!p.rate) return;
  for (let d = 0; d < 365; d++){
    if (d < p.stale) continue;
    let n = 0, r = p.rate;
    while (r > 0){ if (rand() < Math.min(r, 1)) n++; r -= 1; }
    for (let k = 0; k < n; k++){
      const ts = today0 - d * DAY + (6 + Math.floor(rand() * 16)) * HOUR + Math.floor(rand() * 60) * 6e4;
      if (ts > NOW) continue;
      const src = p.src[Math.floor(rand() * p.src.length)];
      let keys;
      if (src === 'Watch') keys = pick(WATCH_ITEMS, 2 + Math.floor(rand() * 3));
      else { keys = pick(HOME_ITEMS, 1 + Math.floor(rand() * 3)); if (rand() < .55 && !keys.includes('血壓')) keys[0] = '血壓'; }
      const items = keys.map(k => ({ k, ab: rand() < p.abn }));
      const ab = items.some(i => i.ab);
      const done = ab && rand() < (NOW - ts > 2 * DAY ? .82 : .3);
      EVENTS.push({ pid: p.id, ts, src, items, ab, done });
    }
  }
});
EVENTS.sort((a, b) => a.ts - b.ts);
const BYPID = {};
EVENTS.forEach(e => (BYPID[e.pid] = BYPID[e.pid] || []).push(e));

/* 個案最新狀態：各項目取最新一次量測；異常且已處理 → 視為正常（同小鈴鐺邏輯） */
const STATUS = {};
PEOPLE.forEach(p => {
  const evs = BYPID[p.id] || [];
  if (!evs.length){ STATUS[p.id] = { st:'none', srcs:[], dev:{}, watch:{}, latest:0, abnItems:[] }; return; }
  const dev = {}, watch = {}, srcs = new Set();
  for (let i = evs.length - 1; i >= 0; i--){
    const e = evs[i]; srcs.add(e.src);
    const g = e.src === 'Watch' ? watch : dev;
    e.items.forEach(it => { if (!(it.k in g)) g[it.k] = { ab: it.ab && !e.done, rawAb: it.ab, done: e.done, ts: e.ts }; });
  }
  const abnItems = [...new Set([...Object.keys(dev).filter(k => dev[k].ab), ...Object.keys(watch).filter(k => watch[k].ab)])];
  STATUS[p.id] = { st: abnItems.length ? 'abn' : 'ok', srcs: ['Pro','Home','Watch'].filter(s => srcs.has(s)), dev, watch, latest: evs[evs.length - 1].ts, abnItems };
});

/* ---------- v2：最新數值（示意）與成員狀態 ---------- */
const STALE_DAYS = 3;
const RANGES = {
  '血壓':[[112,134,72,86],[146,172,92,106],'mmHg'], '血氧':[[96,99],[88,93],'%'], '體溫':[[36.2,37.2],[37.9,38.7],'°C'],
  '血糖':[[82,118],[146,212],'mg/dL'], '尿酸':[[4.1,6.9],[7.8,9.6],'mg/dL'], '總膽固醇':[[150,196],[222,262],'mg/dL'],
  '心率':[[62,88],[106,128],'bpm'], '心率變異性':[[32,58],[12,20],'ms'], '睡眠':[[6.1,7.9],[3.4,4.8],'小時'],
};
function hash(str){ let h = 2166136261; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; }
function valueOf(pid, k, g){
  const r = hash(pid + k + g.ts);
  if (k === '心電') return g.rawAb ? '疑似心房顫動' : '竇性心律';
  const [nr, ar, unit] = RANGES[k], rg = g.rawAb ? ar : nr;
  const lerp = (a, b, t) => a + (b - a) * t;
  if (k === '血壓') return `${Math.round(lerp(rg[0], rg[1], r))}/${Math.round(lerp(rg[2], rg[3], hash(k + pid)))} ${unit}`;
  const v = lerp(rg[0], rg[1], r);
  return `${Number.isInteger(rg[0]) && k !== '睡眠' ? Math.round(v) : v.toFixed(1)} ${unit}`;
}
function mstat(pid){
  const s = STATUS[pid];
  if (s.st === 'none') return 'none';
  if (s.st === 'abn') return 'abn';
  return NOW - s.latest > STALE_DAYS * DAY ? 'stale' : 'ok';
}
const daysSince = ts => Math.floor((NOW - ts) / DAY);
function rel(ts){
  const m = Math.floor((NOW - ts) / 6e4);
  if (m < 60) return `${Math.max(1, m)} 分鐘前`;
  if (m < 1440) return `${Math.floor(m / 60)} 小時前`;
  return `${Math.floor(m / 1440)} 天前`;
}
const RANK = { abn: 0, stale: 1, ok: 2, none: 3 };
const ST_LABEL = { abn: '異常待處理', stale: `逾 ${STALE_DAYS} 天未量測`, ok: '狀態正常', none: '尚無量測資料' };

/* ---------- state ---------- */
const state = { tab: 'list', care: [], sel: null, panelOpen: false, filter: null, kw: '', preset: '30d', from: 0, to: 0, trend: 'people', devMode: 'count', watchMode: 'count', flashKey: null, empty: false };
function seedCare(){
  state.care = [
    { type:'family', fam:'F1', at: NOW - 1 * DAY }, { type:'person', pid:'p21', at: NOW - 2 * DAY },
    { type:'family', fam:'F2', at: NOW - 3 * DAY }, { type:'person', pid:'p15', at: NOW - 4 * DAY },
    { type:'person', pid:'p20', at: NOW - 5 * DAY }, { type:'family', fam:'F4', at: NOW - 6 * DAY },
    { type:'person', pid:'p16', at: NOW - 8 * DAY }, { type:'person', pid:'p17', at: NOW - 9 * DAY },
    { type:'person', pid:'p18', at: NOW - 11 * DAY }, { type:'person', pid:'p19', at: NOW - 12 * DAY },
    { type:'person', pid:'p22', at: NOW - 15 * DAY },
  ];
  state.filter = null; state.kw = ''; state.sel = null;
}
const keyOf = e => e.type === 'family' ? e.fam : e.pid;
const pidsOf = e => e.type === 'family' ? FAM[e.fam] : [e.pid];
const carePids = () => state.care.flatMap(pidsOf);
const inCare = pid => carePids().includes(pid);
function setRange(preset){
  state.preset = preset;
  const t0 = sod(NOW);
  if (preset === 'today'){ state.from = t0; state.to = NOW; }
  else if (preset === '7d'){ state.from = t0 - 6 * DAY; state.to = NOW; }
  else if (preset === '30d'){ state.from = t0 - 29 * DAY; state.to = NOW; }
}
setRange('30d');

function hhModel(e){
  const pids = pidsOf(e), ms = pids.map(mstat);
  const rank = ms.includes('abn') ? 'abn' : ms.includes('stale') ? 'stale' : ms.includes('ok') ? 'ok' : 'none';
  const latest = Math.max(0, ...pids.map(id => STATUS[id].latest));
  const lastAbn = Math.max(0, ...pids.map(id => { const s = STATUS[id]; return Math.max(0, ...[...Object.values(s.dev), ...Object.values(s.watch)].filter(g => g.ab).map(g => g.ts)); }));
  const spec = ms.includes('abn') ? 'abn' : ms.some(m => m === 'ok' || m === 'stale') ? 'ok' : 'none';
  return { e, key: keyOf(e), pids, ms, rank, spec, latest, lastAbn, main: PBY[pids[0]] };
}
const pill = st => ({ abn: '<span class="pill abn">異常</span>', ok: '<span class="pill ok">正常</span>', none: '<span class="pill none">無資料</span>' })[st];
const stripeColor = r => ({ abn: 'var(--abn)', stale: 'var(--stale)', ok: 'var(--ok)', none: 'var(--none)' })[r];

/* ---------- 關懷名單 ---------- */
function renderListTab(){
  const all = state.care.map(hhModel);
  const people = carePids().map(id => [id, mstat(id)]);
  const cnt = st => people.filter(([, m]) => m === st).length;
  const pend = carePids().reduce((n, id) => n + STATUS[id].abnItems.length, 0);
  const tri = (st, title, sub, extra = '') => `<button class="tri ${st}" data-tri="${st}" aria-pressed="${state.filter === st}"><span class="lb"><i></i>${title}</span><span class="v">${cnt(st)}<small>人</small></span><span class="sub">${sub}</span>${extra}</button>`;
  const kw = state.kw.trim();
  let list = all.filter(h => !state.filter || h.ms.includes(state.filter)).filter(h => !kw || h.pids.some(id => PBY[id].name.includes(kw)));
  list.sort((a, b) => RANK[a.rank] - RANK[b.rank] || (b.lastAbn - a.lastAbn) || (b.latest - a.latest));
  if (!state.sel || !all.some(h => h.key === state.sel)) state.sel = list[0] ? list[0].key : null;
  let rows = '';
  ['abn', 'stale', 'ok', 'none'].forEach(r => {
    const g = list.filter(h => h.rank === r); if (!g.length) return;
    rows += `<div class="grp-hd"><i style="background:${stripeColor(r)}"></i>${ST_LABEL[r]}<span class="c">${g.length} 筆</span></div>`;
    g.forEach(h => rows += hhRow(h));
  });
  if (!list.length) rows = `<div class="empty-row">沒有符合條件的關懷對象</div>`;
  $('#app').innerHTML = `
    <section class="triage" aria-label="目前狀態">
      ${tri('abn', '異常待處理', `共 ${pend} 個異常項目未處理`)}
      ${tri('stale', `逾 ${STALE_DAYS} 天未量測`, '有量測紀錄但近期中斷', '<span class="new">建議新增</span>')}
      ${tri('ok', '狀態正常', `最新量測皆在 ${STALE_DAYS} 天內`)}
      ${tri('none', '尚無量測資料', '從未使用任何裝置量測')}
    </section>
    <div class="split">
      <section class="listcard" aria-labelledby="lt">
        <div class="list-tools"><h2 id="lt">關懷名單 <span class="hint" style="font-weight:400;color:var(--muted);font-size:13px">家庭 ${state.care.filter(e => e.type === 'family').length} 戶・個人 ${state.care.filter(e => e.type === 'person').length} 位・共 ${carePids().length} 人</span></h2>
          ${state.filter ? `<button class="clear-filter" data-tri="${state.filter}">篩選：${ST_LABEL[state.filter]} ✕</button>` : ''}
          <input class="kw" id="kw" type="search" placeholder="搜尋姓名" aria-label="搜尋姓名"></div>
        <div id="rows">${rows}</div>
      </section>
      <div class="panel-wrap ${state.panelOpen ? '' : 'closed'}" id="panelWrap"><aside class="panel" id="panel" aria-label="關懷對象詳情"></aside></div>
    </div>`;
  $('#kw').value = state.kw;
  renderPanel();
  if (state.flashKey){ const el = document.querySelector(`.hh[data-key="${state.flashKey}"]`); if (el){ el.classList.add('flash'); el.scrollIntoView({ block: 'nearest' }); } state.flashKey = null; }
}
function hhRow(h){
  const isFam = h.e.type === 'family';
  const abnParts = h.pids.filter(id => STATUS[id].st === 'abn').map(id => `<b>${esc(PBY[id].name)}</b> ${STATUS[id].abnItems.join('、')}`);
  const staleParts = h.pids.filter(id => mstat(id) === 'stale').map(id => `${esc(PBY[id].name)} ${daysSince(STATUS[id].latest)} 天未量測`);
  const members = isFam
    ? h.pids.map((id, i) => `<span><i class="dot ${h.ms[i]}"></i>${esc(PBY[id].rel)} ${esc(PBY[id].name)}</span>`).join('')
    : `<span>${STATUS[h.pids[0]].srcs.map(s => `<span class="chip src">${s}</span>`).join(' ') || '尚未連結裝置'}</span>`;
  return `<button class="hh" data-key="${h.key}" aria-current="${state.sel === h.key}">
    <span class="stripe" style="background:${stripeColor(h.rank)}"></span>
    <span class="body">
      <span class="l1"><span class="nm">${esc(h.main.name)}</span><span class="kind">${isFam ? `家庭・${h.pids.length} 人` : `個人・${h.main.g} ${h.main.age} 歲`}</span>${pill(h.spec)}</span>
      <span class="mem">${members}</span>
      ${abnParts.length ? `<span class="abnline">異常：${abnParts.join('；')}</span>` : ''}
      ${staleParts.length ? `<span class="abnline" style="color:var(--stale)">${staleParts.join('；')}</span>` : ''}
    </span>
    <span class="when">${h.latest ? rel(h.latest) : '—'}<small>${h.latest ? fmtDT(h.latest) : '無量測'}</small></span>
  </button>`;
}
function memberCard(id){
  const p = PBY[id], s = STATUS[id], m = mstat(id);
  const abnList = [], okList = [];
  [['檢測儀', s.dev], ['Watch', s.watch]].forEach(([lb, g]) => Object.keys(g).forEach(k => (g[k].ab ? abnList : okList).push({ k, lb, g: g[k] })));
  abnList.sort((a, b) => b.g.ts - a.g.ts);
  return `<article class="mcard ${m === 'abn' ? 'abn' : ''}">
    <div class="top"><b>${esc(p.name)}</b>${p.fam ? `<span class="rel">${esc(p.rel)}</span>` : ''}${pill(s.st === 'abn' ? 'abn' : s.st)}${m === 'stale' ? `<span class="pill stale">${daysSince(s.latest)} 天未量測</span>` : ''}<span class="sp"></span>
      ${s.srcs.map(x => `<span class="chip src">${x}</span>`).join(' ')}</div>
    <div class="info">${p.g}・${p.age} 歲・${p.h}cm / ${p.w}kg${s.latest ? `・最新量測 ${rel(s.latest)}（${fmtDT(s.latest)}）` : ''}</div>
    ${s.st === 'none' ? '<div class="info" style="margin-top:8px">尚未有任何量測資料。可提醒個案綁定 Home / Pro / Watch 裝置。</div>' : ''}
    ${abnList.length ? `<ul class="vals">${abnList.map(a => `<li class="abn"><span class="k">${a.k}</span><span class="val">${valueOf(id, a.k, a.g)}</span><span class="t">${a.lb}・${rel(a.g.ts)}</span></li>`).join('')}</ul>` : ''}
    ${okList.filter(o => !abnList.some(a => a.k === o.k)).length ? `<div class="okchips"><span>正常：</span>${[...new Set(okList.map(o => o.k).filter(k => !abnList.some(a => a.k === k)))].map(k => `<span class="chip">${k}</span>`).join('')}</div>` : ''}
    <div class="mact">${abnList.length ? `<button class="btn sm abnbtn" data-act="handle" data-pid="${id}">前往處理異常</button>` : ''}<button class="btn sm" data-act="detail" data-pid="${id}">個案詳情 ›</button></div>
  </article>`;
}
function renderPanel(){
  const el = $('#panel'); if (!el) return;
  const e = state.care.find(x => keyOf(x) === state.sel);
  if (!e){ el.innerHTML = '<div class="panel-empty">從左側選擇一位關懷對象</div>'; return; }
  const h = hhModel(e), isFam = e.type === 'family';
  const order = h.pids.slice().sort((a, b) => RANK[mstat(a)] - RANK[mstat(b)]);
  el.innerHTML = `
    <div class="panel-hd"><div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1;min-width:0">
      <div class="bc">${isFam ? '家庭帳號' : '個人帳號'}・加入於 ${fmtD(e.at)}</div>
      <h2>${esc(h.main.name)}${isFam ? ` 家庭` : ''} ${pill(h.spec)}</h2>

/* ---------- 統計 ---------- */
function lowerBound(ts){ let lo = 0, hi = EVENTS.length; while (lo < hi){ const m = (lo + hi) >> 1; if (EVENTS[m].ts < ts) lo = m + 1; else hi = m; } return lo; }
function computeStats(){
  const set = new Set(carePids()), from = state.from, to = state.to;
  const span = to - from;
  const unit = span <= DAY + 1000 ? 'hour' : span <= 62 * DAY ? 'day' : 'month';
  const buckets = [];
  let idxOf;
  if (unit === 'hour'){
    const s = from; for (let t = s; t <= to; t += HOUR) buckets.push({ label: `${pad(new Date(t).getHours())}:00` });
    idxOf = ts => Math.floor((ts - s) / HOUR);
  } else if (unit === 'day'){
    const s = sod(from); for (let t = s; t <= to; t += DAY){ const d = new Date(t); buckets.push({ label: `${pad(d.getMonth()+1)}/${pad(d.getDate())}` }); }
    idxOf = ts => Math.round((sod(ts) - s) / DAY);
  } else {
    const d0 = new Date(from), y0 = d0.getFullYear(), m0 = d0.getMonth(), d1 = new Date(to);
    const n = (d1.getFullYear() - y0) * 12 + d1.getMonth() - m0 + 1;
    for (let i = 0; i < n; i++){ const d = new Date(y0, m0 + i, 1); buckets.push({ label: `${d.getFullYear()}/${pad(d.getMonth()+1)}` }); }
    idxOf = ts => { const d = new Date(ts); return (d.getFullYear() - y0) * 12 + d.getMonth() - m0; };
  }
  buckets.forEach(b => { b.ppl = new Set(); b.visits = 0; b.abn = 0; b.done = 0; });
  const people = new Set(), perPid = {}, dev = {}, watch = {};
  HOME_ITEMS.forEach(k => dev[k] = { n: 0, ab: 0 }); WATCH_ITEMS.forEach(k => watch[k] = { n: 0, ab: 0 });
  let visits = 0, abn = 0, done = 0;
  for (let i = lowerBound(from); i < EVENTS.length && EVENTS[i].ts <= to; i++){
    const e = EVENTS[i]; if (!set.has(e.pid)) continue;
    visits++; people.add(e.pid); perPid[e.pid] = (perPid[e.pid] || 0) + 1;
    if (e.ab){ abn++; if (e.done) done++; }
    const g = e.src === 'Watch' ? watch : dev;
    e.items.forEach(it => { g[it.k].n++; if (it.ab) g[it.k].ab++; });
    const b = buckets[idxOf(e.ts)];
    if (b){ b.ppl.add(e.pid); b.visits++; if (e.ab){ b.abn++; if (e.done) b.done++; } }
  }
  const top = Object.entries(perPid).sort((a, b) => b[1] - a[1]).slice(0, 10);
  return { people: people.size, visits, abn, done, rate: abn ? done / abn * 100 : 0, top, dev, watch, buckets, unit };
}

/* ---------- 圖表（SVG） ---------- */
const CHARTS = {};
let W = 640; const H = 230, PL = 44, PR = 14, PT = 16, PB = 30;
function niceMax(v){ if (v <= 0) return 4; const raw = Math.max(1, v / 4), e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e * 4; }
function axes(max, fmt){
  let s = '';
  for (let i = 0; i <= 4; i++){
    const v = max * i / 4, y = PT + (H - PT - PB) * (1 - i / 4);
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}" stroke="#DDE1E1" stroke-dasharray="${i ? '3 4' : ''}"/><text x="${PL - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  return s;
}
function lineChart(id, labels, series, fmt = v => n0(Math.round(v * 10) / 10), cw = 640){
  W = cw;
  const n = labels.length;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values)));
  const step = n > 1 ? (W - PL - PR) / (n - 1) : 0;
  const x0 = PL, xw = W - PL - PR;
  const x = i => n > 1 ? x0 + step * i : x0 + xw / 2;
  const y = v => PT + (H - PT - PB) * (1 - v / max);
  let s = axes(max, fmt);
  const every = Math.ceil(n / 8);
  labels.forEach((l, i) => { if (i % every === 0 || i === n - 1 && n < 10) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`; });
  series.forEach((se, si) => {
    const pts = se.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    if (si === 0) s += `<path d="M${x(0)},${y(0)} L${pts.join(' L')} L${x(n - 1)},${y(0)} Z" fill="${se.color}" fill-opacity=".08"/>`;
    s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if (n <= 31) se.values.forEach((v, i) => s += `<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${se.color}"/>`);
    const li = n - 1; s += `<circle cx="${x(li)}" cy="${y(se.values[li])}" r="4" fill="#fff" stroke="${se.color}" stroke-width="2"/>`;
  });
  s += `<line class="guide" x1="0" x2="0" y1="${PT}" y2="${H - PB}" stroke="#9AA2A2" stroke-dasharray="2 3" visibility="hidden"/>`;
  CHARTS[id] = { kind: 'line', n, x, labels, series, fmt, W: cw };
  const out = `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join('、'))}趨勢圖">${s}</svg><div class="tip" hidden></div></div>`;
  W = 640;
  return out;
}
function barChart(id, cats, data, mode, color){
  const vals = cats.map(k => mode === 'pct' ? (data[k].n ? data[k].ab / data[k].n * 100 : 0) : data[k].ab);
  const max = mode === 'pct' ? Math.max(10, niceMax(Math.max(...vals))) : niceMax(Math.max(1, ...vals));
  const fmt = mode === 'pct' ? v => `${Math.round(v)}%` : v => n0(Math.round(v));
  const band = (W - PL - PR) / cats.length, bw = Math.min(42, band * .5);
  const y = v => PT + (H - PT - PB) * (1 - v / max);
  let s = axes(max, fmt);
  cats.forEach((k, i) => {
    const cx = PL + band * (i + .5), v = vals[i];
    s += `<rect x="${cx - bw / 2}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${color}"/>`;
    s += `<text class="vlab" x="${cx}" y="${y(v) - 5}" text-anchor="middle">${mode === 'pct' ? v.toFixed(1) + '%' : n0(v)}</text>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${k}</text>`;
  });
  s += `<rect class="guide" x="0" y="${PT}" width="${band}" height="${H - PT - PB}" fill="#00868B" fill-opacity=".06" visibility="hidden"/>`;
  CHARTS[id] = { kind: 'bar', n: cats.length, band, cats, data, W };
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各項目異常統計">${s}</svg><div class="tip" hidden></div></div>`;
}
document.addEventListener('pointermove', ev => {
  const el = ev.target.closest && ev.target.closest('.chart');
  document.querySelectorAll('.chart').forEach(c => { if (c !== el){ c.querySelector('.tip').hidden = true; const g = c.querySelector('.guide'); if (g) g.setAttribute('visibility', 'hidden'); } });
  if (!el) return;
  const c = CHARTS[el.dataset.chart]; if (!c) return;
  const svg = el.querySelector('svg'), r = svg.getBoundingClientRect(), k = r.width / c.W;
  const fx = (ev.clientX - r.left) / k;
  const tip = el.querySelector('.tip'), g = el.querySelector('.guide');
  let i, px, html;
  if (c.kind === 'line'){
    const step = c.n > 1 ? (c.W - PL - PR) / (c.n - 1) : 1;
    i = Math.max(0, Math.min(c.n - 1, Math.round((fx - PL) / step)));
    px = c.x(i); g.setAttribute('x1', px); g.setAttribute('x2', px);
    html = `<b>${c.labels[i]}</b>` + c.series.map(s => `<div class="row"><span class="dot" style="background:${s.color}"></span>${s.name}<span class="num" style="margin-left:auto;padding-left:12px">${c.fmt(s.values[i])}</span></div>`).join('');
  } else {
    i = Math.max(0, Math.min(c.n - 1, Math.floor((fx - PL) / c.band)));
    px = PL + c.band * (i + .5); g.setAttribute('x', PL + c.band * i);
    const d = c.data[c.cats[i]];
    html = `<b>${c.cats[i]}</b><div class="row">異常次數<span class="num" style="margin-left:auto;padding-left:12px">${n0(d.ab)}</span></div><div class="row">量測次數<span class="num" style="margin-left:auto;padding-left:12px">${n0(d.n)}</span></div><div class="row">異常占比<span class="num" style="margin-left:auto;padding-left:12px">${d.n ? (d.ab / d.n * 100).toFixed(1) : '0.0'}%</span></div>`;
  }
  g.setAttribute('visibility', 'visible');
  tip.innerHTML = html; tip.hidden = false;
  const left = Math.max(70, Math.min(r.width - 70, px * k));
  tip.style.left = left + 'px'; tip.style.top = '-6px';
});

  rmKey = key;
  const main = PBY[pidsOf(e)[0]];
  $('#rmText').innerHTML = `<p style="margin:0 0 8px">確定將「<b>${esc(main.name)}</b>」${e.type === 'family' ? `家庭（${pidsOf(e).length} 位成員）` : ''}移出關懷名單？</p><p style="margin:0;font-size:13px;color:var(--muted)">只會從看板移除，個案與家庭帳號的資料、量測紀錄都不受影響，之後可以再加入。</p>`;
  $('#rmModal').hidden = false; $('#rmConfirm').focus();
}
$('#rmConfirm').addEventListener('click', () => {
  const e = state.care.find(x => keyOf(x) === rmKey);
  state.care = state.care.filter(x => keyOf(x) !== rmKey);
  $('#rmModal').hidden = true; state.sel = null; state.panelOpen = false;
  render();
  if (e) toast(`已結束關懷：${PBY[pidsOf(e)[0]].name}${e.type === 'family' ? ' 家庭' : ''}`, 'ok');
});

/* ---------- 設計說明 ---------- */
$('#docBody').innerHTML = `
  <div style="display:flex;align-items:center"><h2 style="flex:1">v2 排版設計說明</h2><button class="icon-btn" data-close aria-label="關閉">×</button></div>
  <h3>出發點</h3>
  <p style="font-size:13px;color:var(--ink2);margin:0">這個看板每天最常被問的問題是「現在誰需要我處理？」，報表是週期性才看。所以 v2 把<b>即時監看</b>和<b>統計報表</b>拆成兩個分頁，各自只有一種時間概念。</p>
  <h3>和 v1（Figma 原排版）的差異</h3>
  <table><thead><tr><th>項目</th><th>v1</th><th>v2</th></tr></thead><tbody>
    <tr><td>頁面結構</td><td>名單與統計同一頁，共用時間篩選</td><td>分成「關懷名單」「統計分析」兩頁；時間篩選只在統計頁出現，不會誤以為名單也被篩選</td></tr>
    <tr><td>首屏重點</td><td>歷史統計數字（人次、處理率）</td><td>目前狀態分流：異常待處理 / 逾期未量測 / 正常 / 無資料，點了就篩選名單</td></tr>
    <tr><td>名單排序</td><td>加入時間；異常的人可能在第 2 頁</td><td>依優先度分組，異常永遠在最上面，組內依最新異常時間排序；不分頁</td></tr>
    <tr><td>家庭呈現</td><td>表格展開第二層，每人一整排 14 個項目標籤</td><td>一列一戶，用狀態點顯示每位成員；只列出<b>異常項目</b>，正常的不佔空間</td></tr>
    <tr><td>看細節</td><td>展開列，或跳離看板到個案詳情</td><td>右側詳情面板（小螢幕改成抽屜），顯示異常項目的實際數值與時間，不離開看板</td></tr>
    <tr><td>時間呈現</td><td>YYYY/MM/DD HH</td><td>「9 小時前」＋完整時間，一眼判斷資料新不新</td></tr>
    <tr><td>結束關懷</td><td>滑鼠移上去才出現，觸控裝置看不到，也容易誤觸</td><td>放在詳情面板底部，二次確認</td></tr>
    <tr><td>重複加入</td><td>toast「已存在相同的病患」</td><td>結果區直接說明已在名單，按鈕變成「在名單中查看」，直接帶過去</td></tr>
    <tr><td>加入按鈕</td><td>「確定」</td><td>寫清楚結果：「加入 4 位成員」</td></tr>
  </tbody></table>
  <h3>超出原需求的建議（可拿掉）</h3>
  <ul>
    <li><b>逾 ${STALE_DAYS} 天未量測</b>：長者突然不量了，往往比單次異常更值得關心。需求只有正常／異常／無資料，這裡用另一個標籤呈現，不改變原本的狀態定義。天數門檻建議可設定。</li>
    <li><b>異常數值</b>：面板直接顯示「血壓 152/96 mmHg」，需要後端回傳最新量測值（原需求只要項目名稱）。</li>
    <li><b>前往處理異常</b>：連到既有的異常事件處理功能，看板本身不做處理流程。</li>
    <li><b>量測覆蓋率</b>：已量測人數 ÷ 名單人數，看出有多少人在這段期間完全沒量。</li>
  </ul>
  <h3>統計頁的調整</h3>
  <ul>
    <li>KPI 改成一整排 5 張，閱讀順序：有多少人在量 → 量了多少次 → 異常多少 → 處理多少 → 處理率。</li>
    <li>「異常與處理趨勢」放大到整寬，放在項目分布之前：先看有沒有變多，再看是哪個項目。</li>

/* ---------- toast / clock / events ---------- */
let toastTimer;
function toast(msg, kind){
  let t = $('.toast'); if (!t){ t = document.createElement('div'); t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.className = `toast ${kind}`; t.innerHTML = `<span class="ic">${kind === 'ok' ? '✓' : '!'}</span><span>${esc(msg)}</span>`; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}
function tick(){ const d = new Date(); $('#clock').textContent = `${fmtD(d)} 星期${'日一二三四五六'[d.getDay()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
tick(); setInterval(tick, 15000);

document.addEventListener('click', ev => {
  const t = ev.target;
  const close = t.closest('[data-close]');
  if (close){ close.closest('.overlay').hidden = true; return; }
  if (t.classList && t.classList.contains('overlay')){ t.hidden = true; return; }
  if (t.id === 'panelWrap'){ state.panelOpen = false; t.classList.add('closed'); return; }
  const tab = t.closest('[data-tab]');
  if (tab){ state.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = t.closest('[data-act]');
  if (a){
    const act = a.dataset.act;
    if (act === 'add') openAdd();
    if (act === 'end') askRemove(a.dataset.key);
    if (act === 'closePanel'){ state.panelOpen = false; $('#panelWrap').classList.add('closed'); }
    if (act === 'detail') toast(`正式版：跳轉至「${PBY[a.dataset.pid].name}」的既有個案詳情頁`, 'ok');
    if (act === 'handle') toast(`正式版：開啟「${PBY[a.dataset.pid].name}」的異常事件處理`, 'ok');
    if (act === 'goto'){ const pid = a.dataset.pid, p = PBY[pid]; state.tab = 'list'; state.filter = null; state.kw = ''; state.sel = p.fam && state.care.some(e => e.fam === p.fam) ? p.fam : pid; state.flashKey = state.sel; state.panelOpen = true; render(); }
    return;
  }
  const hh = t.closest('.hh');
  if (hh){ state.sel = hh.dataset.key; state.panelOpen = true; document.querySelectorAll('.hh').forEach(x => x.setAttribute('aria-current', x === hh)); $('#panelWrap').classList.remove('closed'); renderPanel(); return; }
  const tri = t.closest('[data-tri]');
  if (tri){ state.filter = state.filter === tri.dataset.tri ? null : tri.dataset.tri; state.sel = null; renderListTab(); return; }
  const pre = t.closest('[data-preset]');
  if (pre){ if (pre.dataset.preset === 'custom'){ state.preset = 'custom'; renderStats(); $('#dFrom').focus(); } else { setRange(pre.dataset.preset); renderStats(); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'trend'){ state.trend = t.value; renderStats(); }
  if (t.name === 'devMode'){ state.devMode = t.value; renderStats(); }
  if (t.name === 'watchMode'){ state.watchMode = t.value; renderStats(); }
  if (t.id === 'dFrom' || t.id === 'dTo'){
    const f = $('#dFrom').value, to = $('#dTo').value;
    if (!f || !to) return;
    const a = new Date(f + 'T00:00').getTime(), b = new Date(to + 'T23:59:59').getTime();
    if (a > b){ toast('開始日期不能晚於結束日期', 'warn'); renderStats(); return; }
    if (b - a > 366 * DAY){ toast('自訂區間最長 1 年', 'warn'); renderStats(); return; }
    state.preset = 'custom'; state.from = a; state.to = Math.min(b, NOW); renderStats();
  }
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'kw'){ state.kw = ev.target.value; const pos = ev.target.selectionStart; renderListTab(); const k = $('#kw'); k.focus(); k.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape'){ document.querySelectorAll('.overlay').forEach(o => o.hidden = true); const pw = $('#panelWrap'); if (pw){ state.panelOpen = false; pw.classList.add('closed'); } } });

$('#openDoc').addEventListener('click', () => { $('#docDrawer').hidden = false; });
$('#tglEmpty').addEventListener('click', () => { if (state.care.length) state.care = []; else seedCare(); render(); });
$('#resetAll').addEventListener('click', () => { seedCare(); setRange('30d'); state.tab = 'list'; render(); toast('已重置為範例資料', 'ok'); });

seedCare();
render();
})();
</script>
